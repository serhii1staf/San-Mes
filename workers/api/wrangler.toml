name = "san-mes-api"
main = "src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "8e0d53f0faad2f48870d0a570dadd03f"

# ── MUST BE SET EXPLICITLY, AND MUST STAY ABOVE THE FIRST [[table]]. ─────────
#
# Two separate traps, both hit on the same deploy.
#
# 1. Omitting the key does NOT mean "leave it enabled". Current wrangler treats an
#    absent `workers_dev` as FALSE and disables the route, announcing it as:
#
#      ▲ [WARNING] Because 'workers_dev' is not in your Wrangler file, it will be
#        disabled for this deployment by default.
#
#    A comment further down this file used to claim the opposite ("deliberately NOT set
#    to false — keeping both reachable is the whole point of the failover"). The first
#    deploy after that was written disabled the route, and
#    `san-mes-api.odi44972.workers.dev` began returning 404 — while it is the FIRST
#    candidate in src/services/apiHost.ts and the host every installed build tries
#    first. The client's failover held (api.san-m-app.com answered 200), which is the
#    only reason it was not a full outage.
#
# 2. This key belongs to the TOP-LEVEL table, so it has to appear BEFORE the first
#    `[[...]]` header. Placed after one, TOML makes it a member of that table and
#    wrangler reports `Unexpected fields found in d1_databases[0] field: "workers_dev"`
#    and ignores it — which looks like the fix was applied when it was not.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "san-mes"
database_id = "62428750-5f61-4ed8-9bd9-51241ad95d16"

# Public-by-design vars only. Secrets (Supabase JWT signing key — if we
# move from JWKS to symmetric verification later) MUST go through
# `wrangler secret put`, never here.
# ── Custom domain (availability) ─────────────────────────────────────────────
#
# The app used to talk ONLY to `san-mes-api.odi44972.workers.dev`, which is a poor
# single point of failure: `*.workers.dev` is shared by every free Cloudflare
# account, so it gets blocked as a CATEGORY rather than as a business (it is
# reported unreachable from mainland China), and the account subdomain sits in the
# TLS SNI, which makes filtering trivial.
#
# Serving the same Worker from our own apex removes that class of block and gives
# us a hostname whose DNS we control. The client already fails over between the two
# (see `src/services/apiHost.ts`), so this can be enabled without a coordinated
# release: while the DNS record does not exist the client simply keeps using
# workers.dev.
#
# Keeping BOTH hostnames reachable is the whole point of the failover — see `workers_dev`
# at the top of this file, which is where that is actually enforced.
#
# Requires `san-m-app.com` to be a zone on account 8e0d53f0faad2f48870d0a570dadd03f.
# Cloudflare creates the DNS record and the certificate on deploy.
[[routes]]
pattern = "api.san-m-app.com"
custom_domain = true

[vars]
SUPABASE_PROJECT_REF = "ycwadqglcykcpucembjn"

[observability]
enabled = true
