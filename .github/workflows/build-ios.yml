name: iOS Full Build & TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22, not 20. `eas-cli@latest` pulls `@oclif/plugin-autocomplete@3.3.0`, which declares
      # `engines.node >= 22`, so yarn refuses the install with "Found incompatible module" and the
      # Setup Expo step exits 1 before any command runs. Verified against the failing run: the OTA
      # for 0ab2a8a failed here with nothing wrong in the app at all, and it would have failed for
      # any commit. Pinning eas-cli to an older release would work too, and is worse: it freezes the
      # tool that talks to the build service in order to avoid moving a runtime that Expo already
      # supports.
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # `npm ci` cannot be used here, and this is why every native build since
        # June failed at this step (runs #24 and #25, both `EUSAGE`):
        #
        #   npm error `npm ci` can only install packages when your package.json
        #   and package-lock.json ... are in sync.
        #   npm error Missing: @emnapi/runtime@1.11.3 from lock file
        #   npm error Missing: @emnapi/core@1.11.3 from lock file
        #   npm error Invalid: lock file's @emnapi/wasi-threads@1.2.1 does not
        #             satisfy @emnapi/wasi-threads@1.2.3
        #
        # The lock file is generated on Windows, so it does not carry the
        # platform-specific optional binaries that sharp pulls in on macOS/Linux
        # (the `@img/sharp-*` → `@emnapi/*` WASM chain). `npm ci` validates the
        # tree strictly and rejects the install; `npm install` repairs the lock
        # on the fly. This is the SAME workaround `ota-update.yml` already
        # documents and has been using successfully all along — the native build
        # workflow simply never got it.
        #
        # Optional deps are NOT omitted here (unlike the OTA workflow): a native
        # build runs `verify:theme-assets`, and the image tooling needs them.
        run: npm install --no-audit --no-fund

      # Apple §3.3.4 license gate: fail the build if any bundled profile-theme
      # illustration/font asset ships without a license record.
      - name: Verify theme asset licenses
        run: npm run verify:theme-assets

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write ASC API Key
        run: echo "${{ secrets.ASC_API_KEY_P8 }}" > ./AuthKey_PN7B743Y4X.p8

      - name: Build iOS (EAS)
        run: |
          eas build --platform ios --profile production --non-interactive
        env:
          EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_ASC_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_ASC_API_KEY_PATH: ./AuthKey_PN7B743Y4X.p8
          # Source-maps upload to Sentry happens automatically when this is set.
          # Without it the build still works but stack traces will be minified.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Submit to TestFlight
        if: success()
        run: |
          eas submit --platform ios --profile production --latest --non-interactive
        env:
          EXPO_ASC_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          EXPO_ASC_API_KEY_PATH: ./AuthKey_PN7B743Y4X.p8

      # If the upload fails while the BUILD succeeded (EAS Submit has its own
      # outages — that is exactly what happened on run #26), the binary is
      # already on EAS. Retry just the upload with the `iOS Submit` workflow
      # instead of paying for another 30-40 min native build.
      - name: Note on submit failure
        if: failure()
        run: |
          echo "If 'Build iOS (EAS)' succeeded and only the submit failed, do NOT"
          echo "re-run this workflow. Run the 'iOS Submit (existing build ->"
          echo "TestFlight)' workflow instead — it uploads the existing binary."

      # The key is written into the workspace; remove it even on failure.
      - name: Remove ASC API Key
        if: always()
        run: rm -f ./AuthKey_PN7B743Y4X.p8
