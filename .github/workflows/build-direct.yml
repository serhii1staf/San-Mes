name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22, not 20. `eas-cli@latest` pulls `@oclif/plugin-autocomplete@3.3.0`, which declares
      # `engines.node >= 22`, so yarn refuses the install with "Found incompatible module" and the
      # Setup Expo step exits 1 before any command runs. Verified against the failing run: the OTA
      # for 0ab2a8a failed here with nothing wrong in the app at all, and it would have failed for
      # any commit. Pinning eas-cli to an older release would work too, and is worse: it freezes the
      # tool that talks to the build service in order to avoid moving a runtime that Expo already
      # supports.
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # NOT `npm ci` — the lock file is generated on Windows and therefore lacks
        # the platform-specific optional binaries sharp pulls in on macOS (the
        # `@img/sharp-*` → `@emnapi/*` WASM chain). `npm ci` validates the tree
        # strictly and aborts with:
        #   npm error code EUSAGE
        #   npm error Missing: @emnapi/runtime@1.11.3 from lock file
        # which is what killed the EAS-hosted builds too. `npm install` repairs the
        # lock in place. Same workaround `ota-update.yml` has always used.
        run: npm install --no-audit --no-fund

      # Apple §3.3.4 license gate: fail the build if any bundled profile-theme
      # illustration/font asset ships without a license record.
      - name: Verify theme asset licenses
        run: npm run verify:theme-assets

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write ASC API Key
        run: echo "${{ secrets.ASC_API_KEY_P8 }}" > ./AuthKey_PN7B743Y4X.p8

      - name: Make scripts executable
        run: chmod +x eas-build-post-install.sh

      - name: Build iOS locally with EAS
        run: eas build --platform ios --profile production --local --output ./San.ipa --non-interactive
        env:
          # Source-maps upload to Sentry happens automatically when this is set.
          # Without it the build still works but stack traces will be minified.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Keep the .ipa even when the upload fails. The compile is the expensive
      # part (~25 min); losing it because a 2-minute upload failed means paying
      # for it again. With the artifact retained, a failed upload can be retried
      # — or the build can be pushed to TestFlight by hand from Transporter.
      - name: Upload .ipa as a workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: San-ios-ipa
          path: ./San.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Upload to TestFlight
        if: success()
        # Uploads with Apple's own `altool`, NOT EAS Submit. Together with
        # `--local` above this makes the whole pipeline independent of Expo's
        # build/submit workers — which is the point of this workflow: when
        # status.expo.dev reports EAS Build/Submit `under_maintenance`, the hosted
        # workflow (build-ios.yml) cannot get past scheduling, while this one only
        # needs the EAS API for credentials.
        #
        # `altool` resolves the API key from a `private_keys` directory by
        # filename (`AuthKey_<KEYID>.p8`). It searches ./private_keys,
        # ~/private_keys, ~/.private_keys and ~/.appstoreconnect/private_keys — the
        # key is placed in the two canonical ones because run #41 failed with
        #   ERROR: Cannot determine the Apple ID from Bundle ID 'com.sanmes.app'
        # which is what altool reports when it cannot authenticate well enough to
        # look the app up. `--verbose` is on so the next failure says which.
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          cp ./AuthKey_PN7B743Y4X.p8 ~/private_keys/AuthKey_PN7B743Y4X.p8
          cp ./AuthKey_PN7B743Y4X.p8 ~/.appstoreconnect/private_keys/AuthKey_PN7B743Y4X.p8
          # Sanity-check the key actually arrived as a PEM. A secret that expanded
          # empty, or with escaped newlines, produces exactly the auth failure
          # above — so fail loudly here instead of blaming Apple.
          head -c 27 ./AuthKey_PN7B743Y4X.p8
          echo ""
          wc -l < ./AuthKey_PN7B743Y4X.p8
          xcrun altool --upload-app --type ios --file ./San.ipa \
            --apiKey PN7B743Y4X \
            --apiIssuer "8c0acc2b-73e7-4067-884b-790f14bf4b92" \
            --verbose

      # The private key is written into the workspace and copied into altool's
      # search paths; remove every copy even when the build or upload failed.
      - name: Remove ASC API Key
        if: always()
        run: |
          rm -f ./AuthKey_PN7B743Y4X.p8 \
                ~/private_keys/AuthKey_PN7B743Y4X.p8 \
                ~/.appstoreconnect/private_keys/AuthKey_PN7B743Y4X.p8
