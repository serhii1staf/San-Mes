name: iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # NOT `npm ci` — the lock file is generated on Windows and therefore lacks
        # the platform-specific optional binaries sharp pulls in on macOS (the
        # `@img/sharp-*` → `@emnapi/*` WASM chain). `npm ci` validates the tree
        # strictly and aborts with:
        #   npm error code EUSAGE
        #   npm error Missing: @emnapi/runtime@1.11.3 from lock file
        # which is what killed the EAS-hosted builds too. `npm install` repairs the
        # lock in place. Same workaround `ota-update.yml` has always used.
        run: npm install --no-audit --no-fund

      # Apple §3.3.4 license gate: fail the build if any bundled profile-theme
      # illustration/font asset ships without a license record.
      - name: Verify theme asset licenses
        run: npm run verify:theme-assets

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write ASC API Key
        run: echo "${{ secrets.ASC_API_KEY_P8 }}" > ./AuthKey_PN7B743Y4X.p8

      - name: Make scripts executable
        run: chmod +x eas-build-post-install.sh

      - name: Build iOS locally with EAS
        run: eas build --platform ios --profile production --local --output ./San.ipa --non-interactive
        env:
          # Source-maps upload to Sentry happens automatically when this is set.
          # Without it the build still works but stack traces will be minified.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload to TestFlight
        if: success()
        # Uploads with Apple's own `altool`, NOT EAS Submit. Together with
        # `--local` above this makes the whole pipeline independent of Expo's
        # build/submit workers — which is the point of this workflow: when
        # status.expo.dev reports EAS Build/Submit `under_maintenance`, the hosted
        # workflow (build-ios.yml) cannot get past scheduling, while this one only
        # needs the EAS API for credentials.
        run: |
          mkdir -p ~/private_keys
          cp ./AuthKey_PN7B743Y4X.p8 ~/private_keys/AuthKey_PN7B743Y4X.p8
          xcrun altool --upload-app --type ios --file ./San.ipa --apiKey PN7B743Y4X --apiIssuer "8c0acc2b-73e7-4067-884b-790f14bf4b92"

      # The private key is written into the workspace and copied to ~/private_keys;
      # remove both even when the build or upload failed.
      - name: Remove ASC API Key
        if: always()
        run: rm -f ./AuthKey_PN7B743Y4X.p8 ~/private_keys/AuthKey_PN7B743Y4X.p8
