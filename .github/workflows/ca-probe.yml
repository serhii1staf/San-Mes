name: CA render probe (temporary)
on:
  push:
    branches: [kiro/ca-probe]
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run probe
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string
          swift scripts/ca-probe.swift
