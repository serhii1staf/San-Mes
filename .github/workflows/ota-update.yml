name: OTA Update

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      message:
        description: 'Описание обновления'
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22, not 20. `eas-cli@latest` pulls `@oclif/plugin-autocomplete@3.3.0`, which declares
      # `engines.node >= 22`, so yarn refuses the install with "Found incompatible module" and the
      # Setup Expo step exits 1 before any command runs. Verified against the failing run: the OTA
      # for 0ab2a8a failed here with nothing wrong in the app at all, and it would have failed for
      # any commit. Pinning eas-cli to an older release would work too, and is worse: it freezes the
      # tool that talks to the build service in order to avoid moving a runtime that Expo already
      # supports.
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # Using `npm install` instead of `npm ci` because the lock file was
        # generated on Windows and is missing Linux-only optional binary
        # dependencies (e.g. sharp's @img/sharp-wasm32 wasm chain →
        # @emnapi/runtime). `npm install` repairs the lock on the fly;
        # `npm ci`'s strict validation otherwise rejects the install.
        # `--no-audit --no-fund` keeps the noise down.
        run: npm install --no-audit --no-fund --omit=optional

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA Update
        # ── TWO PUBLISHES, ONE PER SHIPPED PLATFORM ─────────────────────────────
        #
        # This step used to be `--platform ios` alone. That was harmless for as long as there
        # was no Android build to serve, and became a silent trap the moment one existed:
        # every update reached iPhones and NONE reached the Android APK. An `eas update`
        # scoped to one platform does not error or warn — the Android client asks
        # `u.expo.dev` for an update, is told there is nothing for its platform, and keeps
        # running the bundle baked into the APK forever.
        #
        # The obvious fix, `--platform all`, FAILS. Verified: run 32600154127.
        # `all` means every platform the project is configured for, WEB INCLUDED, and the web
        # bundle does not build:
        #
        #     expo export --platform=all exited with non-zero code: 1
        #     Cannot find module 'react-native-web-webview'
        #       node_modules/react-native-youtube-iframe/lib/commonjs/WebView.web.js
        #       | import "react-native-web-webview"
        #
        # `react-native-youtube-iframe` resolves that package only for its web target, and it
        # is not a dependency of this project because web is not a shipped platform. Adding it
        # just to satisfy an export nobody consumes is the wrong trade, and `eas update` has
        # no way to say "all except web" — `--platform` takes exactly one of ios|android|all.
        #
        # So both shipped platforms are published explicitly, with the same message. Each
        # publish is its own update record; a client fetches the newest one matching its own
        # platform and runtime version, so the two are independent and cannot shadow each
        # other. Both share `runtimeVersion.policy = "appVersion"` (1.2.0), so the same JS is
        # valid for both.
        run: |
          eas update --branch production --message "${MSG}" --platform ios
          eas update --branch production --message "${MSG}" --platform android
        env:
          CI: '1'
          MSG: ${{ github.event.inputs.message || github.event.head_commit.message || 'OTA update' }}
          # Source-maps upload to Sentry on each OTA so stack traces stay readable.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
